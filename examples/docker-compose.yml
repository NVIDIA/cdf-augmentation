# Convenience wrapper around the CLI. Endpoint URLs and model names come from
# the config's `endpoints:` list, so nothing about the backend is set here.
# Service names keep the cdf- prefix to match the image.
#
#   docker compose -f examples/docker-compose.yml run --rm cdf-augmentation-gpu \
#     --config configs/cookbook/video-data-augmentation/config_video_transfer_CT3_omni.yaml
#
# Extra CLI arguments (OmegaConf overrides) can be appended to that command.

services:
  cdf-augmentation:
    image: nvcr.io/nvidia/cdf-augmentation:1.2.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Needed only to reach model endpoints on the host's localhost. Drop it when
    # every endpoint is a remote URL.
    network_mode: host
    working_dir: /workspace
    environment:
      # API keys are read from the host environment; each endpoint names the
      # variable it wants via `api_key_env`. Unset variables resolve to no key,
      # which is correct for local, unauthenticated servers.
      VLM_API_KEY: "${VLM_API_KEY:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      BUILD_NVIDIA_API_KEY: "${BUILD_NVIDIA_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      VEO_API_KEY: "${VEO_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ../configs:/workspace/configs
      - ../data:/workspace/data
      # Cloud storage (multi-storage-client) only — create examples/secrets.json
      # first, or Docker will create a directory in its place.
      # - ./secrets.json:/var/secrets/secrets.json:ro

  # Use this service for the CT3 example above, evaluators or
  # data_processing.transcode over H.264 input (hardware h264_cuvid decode
  # only; no software AVC fallback), or the cupy-based
  # data_processing.alignment post-processor. Pick a GPU that is not already
  # saturated by a co-located model server.
  cdf-augmentation-gpu:
    extends:
      service: cdf-augmentation
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu, video]
