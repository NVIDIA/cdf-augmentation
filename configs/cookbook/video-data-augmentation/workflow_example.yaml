data_dir: /path/to/input_media
n_augmentations: 4
config_output: /path/to/generated_configs
example_augmentation_config: config_video_transfer_CT3_omni.yaml
variables:
  weather: {"clear": 0.5, "cloudy": 0.25, "rainy": 0.15, "snowy": 0.1}
  time_of_day: {"dawn": 0.0, "day": 0.5, "dusk": 0.0, "night": 0.5}
conditional_variables:
  road_condition:
    depends_on: weather
    distributions:
      clear: {"dry": 0.95, "wet": 0.05}
      cloudy: {"dry": 0.8, "wet": 0.2}
      rainy: {"wet": 0.85, "puddles": 0.15}
      snowy: {"snowy": 0.8, "slushy": 0.2}
